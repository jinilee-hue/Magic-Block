<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6d9d0" />
  <title>Magic Block</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='40' width='48' height='14' rx='4' fill='%23f7afc3'/%3E%3Crect x='8' y='24' width='48' height='14' rx='4' fill='%23a8e2c4'/%3E%3Crect x='8' y='8' width='48' height='14' rx='4' fill='%23f8dc80'/%3E%3Ctext x='32' y='51' font-family='Arial' font-weight='700' font-size='12' text-anchor='middle' fill='%23a8365f'%3Em%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app" data-screen="intro">
    <!-- the painted playroom (behind the WebGL canvas; the tower stands on its table) + a few floating bubbles -->
    <div class="sky" aria-hidden="true">
      <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i><i class="orb o5"></i>
    </div>

    <div id="stage" class="stage"></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <!-- tutor fox -->
    <div id="fox" class="fox"><canvas aria-hidden="true"></canvas>
      <!-- the fox's speech bubble: what it is saying; the turn call stays up during a turn (ui/foxsay.ts) -->
      <div id="foxSay" class="fox-say" role="status" aria-live="polite" hidden>
        <div class="fs-bubble"><span class="fs-ava"><img class="ani" src="./src/assets/ani_bunny.webp" alt="" draggable="false" /></span><span class="fs-text"></span></div>
        <i class="fs-tail" aria-hidden="true"></i>
      </div>
    </div>

    <!-- HUD: logo top-left, player cards down the left and right sides -->
    <header class="hud">
      <div id="p1" class="pcard p1" data-p="0">
        <div class="avatar"><img class="ani" src="./src/assets/ani_bunny.webp" alt="" draggable="false" /></div>
        <div class="pinfo"><b class="pname" data-i18n="p1">Player 1</b><span class="pscore"><i class="mini-block"></i><b class="num">0</b><span class="strikes" aria-label="wrong blocks" data-i18n-aria="a_strikes"><i></i><i></i><i></i></span></span></div>
        <div class="chips"></div>
      </div>
      <div id="p2" class="pcard p2" data-p="1">
        <div class="avatar"><img class="ani" src="./src/assets/ani_kitty.webp" alt="" draggable="false" /></div>
        <div class="pinfo"><b class="pname" data-i18n="p2">Player 2</b><span class="pscore"><i class="mini-block"></i><b class="num">0</b><span class="strikes" aria-label="wrong blocks" data-i18n-aria="a_strikes"><i></i><i></i><i></i></span></span></div>
        <div class="chips"></div>
      </div>
    </header>

    <!-- corner bar (ui/corner.ts), the same on the title and in the game: sound (speaker + volume slider) and exit;
         EN | 한 (core/lang.ts) shows in the game only -->
    <div class="sysbar">
      <button id="btnLang" class="lang-tog" data-l="en" aria-label="Language: English or Korean" data-i18n-aria="a_lang" aria-pressed="false">
        <span class="knob"></span>
        <span class="flag on" data-l="en"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="flag-en"><circle cx="12" cy="12" r="12"/></clipPath></defs><g clip-path="url(#flag-en)"><rect width="24" height="24" fill="#fff"/><rect y="0" width="24" height="1.85" fill="#b22234"/><rect y="3.69" width="24" height="1.85" fill="#b22234"/><rect y="7.38" width="24" height="1.85" fill="#b22234"/><rect y="11.08" width="24" height="1.85" fill="#b22234"/><rect y="14.77" width="24" height="1.85" fill="#b22234"/><rect y="18.46" width="24" height="1.85" fill="#b22234"/><rect y="22.15" width="24" height="1.85" fill="#b22234"/><rect width="12" height="12.92" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.8" r=".7"/><circle cx="4.5" cy="1.8" r=".7"/><circle cx="7.4" cy="1.8" r=".7"/><circle cx="10.3" cy="1.8" r=".7"/><circle cx="3.05" cy="3.7" r=".7"/><circle cx="5.95" cy="3.7" r=".7"/><circle cx="8.85" cy="3.7" r=".7"/><circle cx="1.6" cy="5.6" r=".7"/><circle cx="4.5" cy="5.6" r=".7"/><circle cx="7.4" cy="5.6" r=".7"/><circle cx="10.3" cy="5.6" r=".7"/><circle cx="3.05" cy="7.5" r=".7"/><circle cx="5.95" cy="7.5" r=".7"/><circle cx="8.85" cy="7.5" r=".7"/><circle cx="1.6" cy="9.4" r=".7"/><circle cx="4.5" cy="9.4" r=".7"/><circle cx="7.4" cy="9.4" r=".7"/><circle cx="10.3" cy="9.4" r=".7"/><circle cx="3.05" cy="11.3" r=".7"/><circle cx="5.95" cy="11.3" r=".7"/><circle cx="8.85" cy="11.3" r=".7"/></g></g></svg></span>
        <span class="flag" data-l="ko"><svg viewBox="-12 -12 24 24" aria-hidden="true"><defs><clipPath id="flag-ko"><circle r="12"/></clipPath></defs><g clip-path="url(#flag-ko)"><rect x="-18" y="-12" width="36" height="24" fill="#fff"/><g transform="rotate(33.69)"><path d="M-6 0a6 6 0 0 1 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#cd2e3a"/><path d="M-6 0a6 6 0 0 0 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#0047a0"/></g><g fill="#151515"><g transform="rotate(33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="5.6"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g><g transform="rotate(33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="2.5"/><rect x="-.75" y=".3" width=".9" height="2.5"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="5.6"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="2.5"/><rect x="-.15" y=".3" width=".9" height="2.5"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g></g></g></svg></span>
      </button>
      <div id="vol" class="vol">
        <button id="btnSound" class="img-btn" aria-label="Volume" data-i18n-aria="a_volume" aria-expanded="false" aria-controls="volPanel">
          <img src="./src/assets/btn_sound.webp" alt="" draggable="false" />
        </button>
        <div id="volPanel" class="vol-panel" role="slider" tabindex="0" aria-label="Volume" data-i18n-aria="a_volume" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden>
          <div class="vol-track"><i class="vol-fill"></i><i class="vol-thumb"></i></div>
        </div>
      </div>
      <button id="btnExit" class="img-btn" aria-label="Exit" data-i18n-aria="a_exit"><img src="./src/assets/btn_out.webp" alt="" draggable="false" /></button>
    </div>

    <!-- bottom dock: turn the tower -->
    <div id="dock" class="dock">
      <button id="btnReset" class="art-btn" aria-label="Back to the start view" data-i18n-aria="a_reset"><img src="./src/assets/btn_reset.webp" alt="" draggable="false" /></button>
    </div>
    <div id="swipe" class="swipe-hint" aria-hidden="true"><img class="hand" src="./src/assets/hand.webp" alt="" draggable="false" /></div>

    <!-- picture card: the pulled block turns into it while the child reads the word (picture over the word) -->
    <div id="picCard" class="pic-card" hidden><img alt="" draggable="false" /><b class="pc-word"></b></div>

    <!-- read-aloud controls -->
    <div id="read" class="read" hidden>
      <button id="btnListen" class="read-speaker" aria-label="Listen again" data-i18n-aria="a_listen"><img src="./src/assets/btn_speaker.webp" alt="" draggable="false" /></button>
      <div class="mic-wrap">
        <i class="wave l w1"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i><i class="wave l w2"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i><i class="wave l w3"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i>
        <button id="btnMic" class="mic" aria-label="Say the word" data-i18n-aria="a_say"><img src="./src/assets/btn_mic.webp" alt="" draggable="false" /><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7" /></svg><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" /></svg></button>
        <i class="wave r w1"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i><i class="wave r w2"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i><i class="wave r w3"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M78 10C22 18 22 82 78 90" /></svg></i>
      </div>
      <button id="btnThumb" class="btn3d round green" hidden aria-label="I said it" data-i18n-aria="a_said"><svg viewBox="0 0 24 24"><path d="M7 10.5V20H4.5v-9.5zM7 10.5l4-7c1.6 0 2.4 1 2.1 2.6L12.6 9h5.2c1.3 0 2.2 1.2 1.9 2.4l-1.6 6.4c-.3 1.3-1.4 2.2-2.7 2.2H7" /></svg></button>
    </div>

    <!-- title -->
    <div id="title" class="title-screen">
      <div class="title-group">
        <h1 class="logo"><img src="./src/assets/logo.webp" alt="Magic Block" draggable="false" /></h1>
        <button id="btnStart" class="start-btn" aria-label="Start" data-i18n-aria="a_start"><img src="./src/assets/btn_start.webp" alt="START!" draggable="false" /></button>
      </div>
      <div id="pick" class="pick" hidden>
        <div class="pick-card">
          <div class="pick-head"><span id="pickWho" class="pick-who">Player 1</span></div>
          <div class="pick-row">
            <button class="pick-ani" data-id="bunny"><span class="pa-art"><img class="ani" src="./src/assets/ani_bunny.webp" alt="" draggable="false" /><i class="pa-tag"></i></span><b data-i18n="bunny">Bunny</b></button>
            <button class="pick-ani" data-id="kitty"><span class="pa-art"><img class="ani" src="./src/assets/ani_kitty.webp" alt="" draggable="false" /><i class="pa-tag"></i></span><b data-i18n="kitty">Kitty</b></button>
            <button class="pick-ani" data-id="puppy"><span class="pa-art"><img class="ani" src="./src/assets/ani_puppy.webp" alt="" draggable="false" /><i class="pa-tag"></i></span><b data-i18n="puppy">Puppy</b></button>
            <button class="pick-ani" data-id="panda"><span class="pa-art"><img class="ani" src="./src/assets/ani_panda.webp" alt="" draggable="false" /><i class="pa-tag"></i></span><b data-i18n="panda">Panda</b></button>
          </div>
          <!-- both picked: pick again, or start (user: "reset과 start버튼 있어서 다시 고르거나 시작할수 있게") -->
          <div class="pick-go">
            <button id="pickReset" class="box-btn replay"><svg viewBox="0 0 24 24"><path d="M4.6 7.3A8.6 8.6 0 1 1 3.6 13" /><path d="M8.5 7.5H4.2V3.2" /></svg><span data-i18n="pick_reset">Reset</span></button>
            <button id="pickStart" class="box-btn"><svg class="solid" viewBox="0 0 24 24"><path d="M8.4 5.4 18.2 12 8.4 18.6z" /></svg><span data-i18n="pick_start">Start</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- intro video -->
    <div id="intro" class="intro">
      <video id="introVideo" playsinline preload="auto"></video>
      <button id="introSkip" class="intro-skip" data-i18n="skip">SKIP</button>
    </div>

    <!-- result book -->
    <div id="result" class="result" hidden>
      <div class="book">
        <div class="page left" data-p="0"></div>
        <div class="spine"></div>
        <div class="page right" data-p="1"></div>
      </div>
      <div class="result-actions">
        <button id="btnAgain" class="box-btn" data-i18n-aria="again"><svg viewBox="0 0 24 24"><path d="M19.4 7.3A8.6 8.6 0 1 0 20.4 13" /><path d="M15.5 7.5h4.3V3.2" /></svg><span data-i18n="again">Play Again</span></button>
        <button id="btnResultHome" class="box-btn home" data-i18n-aria="home"><svg class="solid" viewBox="0 0 24 24"><path d="M12 3.6 3.8 10.8V20h6.2v-5.4h4V20h6.2V10.8z" /></svg><span data-i18n="home">Home</span></button>
      </div>
    </div>

    <div id="loading" class="loading"><i></i></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
