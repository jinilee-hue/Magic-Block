<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6d9d0" />
  <title>Magic Jenga</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='40' width='48' height='14' rx='4' fill='%23f7afc3'/%3E%3Crect x='8' y='24' width='48' height='14' rx='4' fill='%23a8e2c4'/%3E%3Crect x='8' y='8' width='48' height='14' rx='4' fill='%23f8dc80'/%3E%3Ctext x='32' y='51' font-family='Arial' font-weight='700' font-size='12' text-anchor='middle' fill='%23a8365f'%3Em%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app" data-screen="intro">
    <!-- the painted playroom (behind the WebGL canvas; the tower stands on its table) + a few floating bubbles -->
    <div class="sky" aria-hidden="true">
      <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i><i class="orb o5"></i>
    </div>

    <div id="stage" class="stage"></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <!-- tutor fox -->
    <div id="fox" class="fox" aria-hidden="true"><canvas></canvas></div>

    <!-- top HUD -->
    <header class="hud">
      <button id="btnHome" class="btn3d sq purple" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2" /><path d="M5.8 9.6V20h4.4v-5.2h3.6V20h4.4V9.6" /></svg>
      </button>
      <div id="p1" class="pcard p1" data-p="0">
        <div class="avatar"><svg viewBox="0 0 64 64"><use href="#ava-bunny" /></svg></div>
        <div class="pinfo"><b class="pname">Player 1</b><span class="pscore"><i class="mini-block"></i><b class="num">0</b></span></div>
        <div class="chips"></div>
      </div>
      <div id="turnPill" class="turn-pill" aria-live="polite"><span class="tp-dot"></span><span class="tp-text">Player 1's Turn</span></div>
      <div id="p2" class="pcard p2" data-p="1">
        <div class="avatar"><svg viewBox="0 0 64 64"><use href="#ava-kitty" /></svg></div>
        <div class="pinfo"><b class="pname">Player 2</b><span class="pscore"><i class="mini-block"></i><b class="num">0</b></span></div>
        <div class="chips"></div>
      </div>
      <button id="btnSettings" class="btn3d sq purple" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      </button>
    </header>

    <div id="settings" class="settings" hidden>
      <button class="tog" data-k="music" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" /></svg><span>Music</span></button>
      <button class="tog" data-k="sfx" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a7.8 7.8 0 0 1 0 11" /></svg><span>Sounds</span></button>
    </div>

    <!-- bottom dock: turn the tower -->
    <div id="dock" class="dock">
      <button id="rotL" class="btn3d round sky" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M8.5 7.5H4.2V3.2" /><path d="M4.6 7.3A8.6 8.6 0 1 1 3.6 13" /></svg></button>
      <button id="rotR" class="btn3d round sky" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M15.5 7.5h4.3V3.2" /><path d="M19.4 7.3A8.6 8.6 0 1 0 20.4 13" /></svg></button>
    </div>
    <div id="swipe" class="swipe-hint" aria-hidden="true"><img class="hand" src="./src/assets/hand.webp" alt="" draggable="false" /></div>

    <!-- picture card shown above the pulled block while the child reads the word -->
    <div id="picCard" class="pic-card" hidden><img alt="" draggable="false" /></div>

    <!-- read-aloud controls -->
    <div id="read" class="read" hidden>
      <button id="btnListen" class="btn3d round blue small" aria-label="Listen again"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a7.8 7.8 0 0 1 0 11" /></svg></button>
      <div class="mic-wrap">
        <i class="wave l w1"></i><i class="wave l w2"></i><i class="wave l w3"></i>
        <button id="btnMic" class="mic" aria-label="Say the word"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" /></svg><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7" /></svg><i class="ring"></i></button>
        <i class="wave r w1"></i><i class="wave r w2"></i><i class="wave r w3"></i>
      </div>
      <button id="btnThumb" class="btn3d round green" hidden aria-label="I said it"><svg viewBox="0 0 24 24"><path d="M7 10.5V20H4.5v-9.5zM7 10.5l4-7c1.6 0 2.4 1 2.1 2.6L12.6 9h5.2c1.3 0 2.2 1.2 1.9 2.4l-1.6 6.4c-.3 1.3-1.4 2.2-2.7 2.2H7" /></svg></button>
    </div>

    <!-- title -->
    <div id="title" class="title-screen">
      <div class="title-group">
        <h1 class="logo"><img src="./src/assets/logo.webp" alt="Magic Jenga" draggable="false" /></h1>
        <button id="btnStart" class="start-btn" aria-label="Start"><img src="./src/assets/btn_start.webp" alt="START!" draggable="false" /></button>
      </div>
      <!-- sound (speaker + volume slider) and exit, top right -->
      <div id="pick" class="pick" hidden>
        <div class="pick-card">
          <button id="pickBack" class="pick-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg></button>
          <div class="pick-head"><span id="pickWho" class="pick-who">Player 1</span></div>
          <div class="pick-row">
            <button class="pick-ani" data-id="bunny"><span class="pa-art"><svg viewBox="0 0 64 64"><use href="#ava-bunny" /></svg><i class="pa-tag"></i></span><b>Bunny</b></button>
            <button class="pick-ani" data-id="kitty"><span class="pa-art"><svg viewBox="0 0 64 64"><use href="#ava-kitty" /></svg><i class="pa-tag"></i></span><b>Kitty</b></button>
            <button class="pick-ani" data-id="puppy"><span class="pa-art"><svg viewBox="0 0 64 64"><use href="#ava-puppy" /></svg><i class="pa-tag"></i></span><b>Puppy</b></button>
            <button class="pick-ani" data-id="panda"><span class="pa-art"><svg viewBox="0 0 64 64"><use href="#ava-panda" /></svg><i class="pa-tag"></i></span><b>Panda</b></button>
          </div>
          <div class="pick-vs">
            <div class="pv p1"><span class="pv-ava"><svg viewBox="0 0 64 64"><use href="" /></svg><i>?</i></span><b>Player 1</b></div>
            <span class="pv-x">VS</span>
            <div class="pv p2"><span class="pv-ava"><svg viewBox="0 0 64 64"><use href="" /></svg><i>?</i></span><b>Player 2</b></div>
          </div>
        </div>
      </div>
      <div class="sysbar">
        <div id="vol" class="vol">
          <button id="btnSound" class="img-btn" aria-label="Volume" aria-expanded="false" aria-controls="volPanel">
            <img src="./src/assets/btn_sound.webp" alt="" draggable="false" /><i class="mute-badge" aria-hidden="true"></i>
          </button>
          <div id="volPanel" class="vol-panel" role="slider" tabindex="0" aria-label="Volume" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden>
            <div class="vol-track"><i class="vol-fill"></i><i class="vol-thumb"></i></div>
          </div>
        </div>
        <button id="btnExit" class="img-btn" aria-label="Exit"><img src="./src/assets/btn_out.webp" alt="" draggable="false" /></button>
      </div>
    </div>

    <!-- intro video -->
    <div id="intro" class="intro">
      <video id="introVideo" playsinline preload="auto"></video>
      <button id="introSkip" class="intro-skip">SKIP</button>
    </div>

    <!-- result book -->
    <div id="result" class="result" hidden>
      <div class="book">
        <div class="page left" data-p="0"></div>
        <div class="spine"></div>
        <div class="page right" data-p="1"></div>
      </div>
      <div class="result-actions">
        <button id="btnAgain" class="btn3d pill green"><svg viewBox="0 0 24 24"><path d="M19.4 7.3A8.6 8.6 0 1 0 20.4 13" /><path d="M15.5 7.5h4.3V3.2" /></svg><span>Play Again</span></button>
        <button id="btnResultHome" class="btn3d pill purple"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2" /><path d="M5.8 9.6V20h4.4v-5.2h3.6V20h4.4V9.6" /></svg><span>Home</span></button>
      </div>
    </div>

    <div id="loading" class="loading"><i></i></div>
  </div>

  <!-- avatars -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ava-bunny" viewBox="0 0 64 64">
        <ellipse cx="22" cy="17" rx="6.5" ry="15" fill="#fff" stroke="currentColor" stroke-width="2.4" />
        <ellipse cx="42" cy="17" rx="6.5" ry="15" fill="#fff" stroke="currentColor" stroke-width="2.4" />
        <ellipse cx="22" cy="18" rx="2.8" ry="10" fill="#ffc2d6" />
        <ellipse cx="42" cy="18" rx="2.8" ry="10" fill="#ffc2d6" />
        <circle cx="32" cy="40" r="19" fill="#fff" stroke="currentColor" stroke-width="2.4" />
        <circle cx="25" cy="38" r="2.8" fill="#26324d" /><circle cx="39" cy="38" r="2.8" fill="#26324d" />
        <circle cx="25.9" cy="37" r="0.9" fill="#fff" /><circle cx="39.9" cy="37" r="0.9" fill="#fff" />
        <ellipse cx="20" cy="45" rx="3.6" ry="2.3" fill="#ffb3c9" /><ellipse cx="44" cy="45" rx="3.6" ry="2.3" fill="#ffb3c9" />
        <path d="M29.6 43.4q2.4 2 4.8 0" fill="#ff8fb0" />
        <path d="M32 45v2.4M28.8 48.4q3.2 2.6 6.4 0" stroke="#26324d" stroke-width="1.8" fill="none" stroke-linecap="round" />
      </symbol>
      <symbol id="ava-kitty" viewBox="0 0 64 64">
        <path d="M12 30 14 9l14 12zM52 30 50 9 36 21z" fill="#ffd9a8" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M16.4 23.6 17.3 14l6.4 5.6zM47.6 23.6 46.7 14l-6.4 5.6z" fill="#ffc2d6" />
        <ellipse cx="32" cy="39" rx="21" ry="18.5" fill="#ffd9a8" stroke="currentColor" stroke-width="2.4" />
        <path d="M27 21.6q5-1.8 10 0M25.6 25.4q6.4-2.2 12.8 0" stroke="#f0a95c" stroke-width="2" fill="none" stroke-linecap="round" />
        <circle cx="24.5" cy="37" r="2.8" fill="#26324d" /><circle cx="39.5" cy="37" r="2.8" fill="#26324d" />
        <circle cx="25.4" cy="36" r="0.9" fill="#fff" /><circle cx="40.4" cy="36" r="0.9" fill="#fff" />
        <ellipse cx="19.5" cy="44" rx="3.6" ry="2.3" fill="#ffb3c9" /><ellipse cx="44.5" cy="44" rx="3.6" ry="2.3" fill="#ffb3c9" />
        <path d="M30 42.2h4l-2 2.2z" fill="#ff8fb0" />
        <path d="M32 44.4v1.6M28 47q2 1.8 4-.6 2 2.4 4 .6" stroke="#26324d" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10 41.5h7M10.5 46l6.5-1.6M54 41.5h-7M53.5 46 47 44.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="ava-puppy" viewBox="0 0 64 64">
        <path d="M17.5 21.5c-6.2 1-10.6 10.4-9.6 18.6.5 4.2 4.6 5.6 7.6 2.6l5.4-11.6z" fill="#b97a4e" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M46.5 21.5c6.2 1 10.6 10.4 9.6 18.6-.5 4.2-4.6 5.6-7.6 2.6l-5.4-11.6z" fill="#b97a4e" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
        <ellipse cx="32" cy="39" rx="19.5" ry="18.5" fill="#fff4e6" stroke="currentColor" stroke-width="2.4" />
        <ellipse cx="39.6" cy="35.6" rx="6.4" ry="5.6" fill="#f0c9a0" />
        <circle cx="24.5" cy="37" r="2.8" fill="#26324d" /><circle cx="39.5" cy="37" r="2.8" fill="#26324d" />
        <circle cx="25.4" cy="36" r="0.9" fill="#fff" /><circle cx="40.4" cy="36" r="0.9" fill="#fff" />
        <ellipse cx="19.5" cy="45" rx="3.4" ry="2.2" fill="#ffb3c9" /><ellipse cx="44.5" cy="45" rx="3.4" ry="2.2" fill="#ffb3c9" />
        <ellipse cx="32" cy="43.2" rx="3.4" ry="2.4" fill="#26324d" />
        <path d="M32 45.6v1.8M28.4 48.4q3.6 2.8 7.2 0" stroke="#26324d" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M30.6 49.6q1.4 3.4 2.8 0" fill="#ff7f9f" />
      </symbol>
      <symbol id="ava-panda" viewBox="0 0 64 64">
        <circle cx="15.5" cy="22" r="7.4" fill="#3d4256" stroke="currentColor" stroke-width="2.4" />
        <circle cx="48.5" cy="22" r="7.4" fill="#3d4256" stroke="currentColor" stroke-width="2.4" />
        <ellipse cx="32" cy="39" rx="21" ry="18.5" fill="#fff" stroke="currentColor" stroke-width="2.4" />
        <ellipse cx="23.6" cy="37.4" rx="5" ry="6.4" transform="rotate(-28 23.6 37.4)" fill="#3d4256" />
        <ellipse cx="40.4" cy="37.4" rx="5" ry="6.4" transform="rotate(28 40.4 37.4)" fill="#3d4256" />
        <circle cx="24.2" cy="37" r="2.4" fill="#fff" /><circle cx="39.8" cy="37" r="2.4" fill="#fff" />
        <circle cx="24.5" cy="37.3" r="1.35" fill="#26324d" /><circle cx="39.5" cy="37.3" r="1.35" fill="#26324d" />
        <ellipse cx="18.6" cy="45.4" rx="3.2" ry="2.1" fill="#ffb3c9" /><ellipse cx="45.4" cy="45.4" rx="3.2" ry="2.1" fill="#ffb3c9" />
        <ellipse cx="32" cy="43.4" rx="2.8" ry="2" fill="#26324d" />
        <path d="M32 45.4v1.8M28.8 48.2q3.2 2.6 6.4 0" stroke="#26324d" stroke-width="1.8" fill="none" stroke-linecap="round" />
      </symbol>
    </defs>
  </svg>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
